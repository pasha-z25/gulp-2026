<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gulp starter</title>
    <link rel="stylesheet" href="css/fonts.css">
    <link rel="stylesheet" href="css/main.css">
</head>

<body>
    <h1>Hello World</h1>
    <picture>
        <source type="image/avif" srcset="
                /images/cat-940x640-480.avif 480w,
                /images/cat-940x640-768.avif 768w,
                /images/cat-940x640-940.avif 940w
            " sizes="100vw">

        <source type="image/webp" srcset="
                /images/cat-940x640-480.webp 480w,
                /images/cat-940x640-768.webp 768w,
                /images/cat-940x640-940.webp 940w
            " sizes="100vw">

        <img src="/images/cat-940x640-940.jpg" srcset="
                /images/cat-940x640-480.jpg 480w,
                /images/cat-940x640-768.jpg 768w,
                /images/cat-940x640-940.jpg 940w
            " sizes="100vw" alt="Cat">
    </picture>
    <script src="js/main.js"></script>
</body>

</html>
